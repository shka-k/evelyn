[package]
name = "evelyn"
version = "1.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
arboard = { version = "3", default-features = false }
bytemuck = "1"
glyphon = "0.11.0"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
png = "0.18"
pollster = "0.4.0"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
sys-locale = "0.3"
toml = "0.8"
unicode-script = "0.5"
unicode-width = "0.2"
vte = "0.15"
wgpu = "29"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSBox", "NSButton", "NSColor", "NSControl", "NSGraphics", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
